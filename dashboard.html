<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Hair Studio Picasso</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #000;
      color: #fff;
      padding: 20px;
      min-height: 100vh;
    }

    .dashboard-header {
      text-align: center;
      padding: 40px 20px;
      border-bottom: 2px solid #c9a227;
      margin-bottom: 40px;
    }

    .dashboard-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: #c9a227;
      margin-bottom: 10px;
    }

    .dashboard-subtitle {
      color: #ccc;
      font-size: 1rem;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #c9a227;
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.3s;
    }

    .back-link:hover {
      opacity: 0.7;
    }

    .filter-section {
      max-width: 1200px;
      margin: 0 auto 30px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .filter-btn {
      padding: 10px 25px;
      background: transparent;
      border: 2px solid #c9a227;
      color: #c9a227;
      border-radius: 25px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      transition: all 0.3s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: #c9a227;
      color: #000;
    }

    .reservations-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .reservations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }

    .reservation-card {
      background: linear-gradient(145deg, #111, #1a1a1a);
      border: 2px solid #333;
      border-radius: 15px;
      padding: 25px;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .reservation-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #c9a227, #d4af37);
    }

    .reservation-card:hover {
      border-color: #c9a227;
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(201, 162, 39, 0.2);
    }

    .reservation-card.completed {
      opacity: 0.6;
      border-color: #4caf50;
    }

    .reservation-card.completed::before {
      background: #4caf50;
    }

    .reservation-card.cancelled {
      opacity: 0.5;
      border-color: #f44336;
    }

    .reservation-card.cancelled::before {
      background: #f44336;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .status-badge {
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-badge.pending {
      background: rgba(255, 193, 7, 0.2);
      color: #ffc107;
      border: 1px solid #ffc107;
    }

    .status-badge.completed {
      background: rgba(76, 175, 80, 0.2);
      color: #4caf50;
      border: 1px solid #4caf50;
    }

    .status-badge.cancelled {
      background: rgba(244, 67, 54, 0.2);
      color: #f44336;
      border: 1px solid #f44336;
    }

    .reservation-time {
      font-size: 1.1rem;
      color: #c9a227;
      font-weight: 600;
    }

    .reservation-info {
      margin: 15px 0;
    }

    .info-row {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
    }

    .info-row:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .info-label {
      font-size: 0.85rem;
      color: #888;
      min-width: 80px;
      margin-right: 10px;
    }

    .info-value {
      color: #fff;
      font-weight: 500;
      word-break: break-word;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #333;
    }

    .action-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.3s;
    }

    .complete-btn {
      background: #4caf50;
      color: #fff;
    }

    .complete-btn:hover {
      background: #45a049;
      transform: scale(1.05);
    }

    .cancel-btn {
      background: #f44336;
      color: #fff;
    }

    .cancel-btn:hover {
      background: #da190b;
      transform: scale(1.05);
    }

    .action-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #888;
    }

    .empty-state svg {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      stroke: #444;
    }

    .empty-state h3 {
      font-size: 1.5rem;
      color: #666;
      margin-bottom: 10px;
    }

    @media (max-width: 768px) {
      .dashboard-title {
        font-size: 2rem;
      }

      .reservations-grid {
        grid-template-columns: 1fr;
      }

      .filter-section {
        flex-direction: column;
      }

      .filter-btn {
        width: 100%;
      }
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #c9a227;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="dashboard-header">
    <a href="index.html" class="back-link">← Kthehu në faqen kryesore</a>
    <h1 class="dashboard-title">Dashboard</h1>
    <p class="dashboard-subtitle">Hair Studio Picasso - Menaxhimi i Rezervimeve</p>
  </div>

  <div class="filter-section">
    <button class="filter-btn active" data-filter="all">Të Gjitha</button>
    <button class="filter-btn" data-filter="pending">Në Pritje</button>
    <button class="filter-btn" data-filter="completed">Të Përfunduara</button>
    <button class="filter-btn" data-filter="cancelled">Të Anuluara</button>
  </div>

  <div class="reservations-container">
    <div id="reservationsGrid" class="reservations-grid">
      <div class="loading">Duke ngarkuar rezervimet...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
    import { getFirestore, collection, query, onSnapshot, doc, updateDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDpmPyRDHhHIsh-uWgC5RweqwplOXJBql0",
      authDomain: "picasso-56a7f.firebaseapp.com",
      projectId: "picasso-56a7f",
      storageBucket: "picasso-56a7f.firebasestorage.app",
      messagingSenderId: "895913212897",
      appId: "1:895913212897:web:09779428d3811b1874f0a0",
      measurementId: "G-HGBZLLZEN5"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    console.log("[Dashboard] Firebase initialized");

    let allReservations = [];
    let currentFilter = 'all';

    // Listen to real-time reservations
    const reservationsRef = collection(db, "reservations");
    const q = query(reservationsRef, orderBy("timestamp", "desc"));

    onSnapshot(q, (snapshot) => {
      console.log("[Dashboard] Received", snapshot.size, "reservations");
      
      allReservations = [];
      snapshot.forEach((doc) => {
        allReservations.push({ id: doc.id, ...doc.data() });
      });

      renderReservations(currentFilter);
    }, (error) => {
      console.error("[Dashboard] Error listening to reservations:", error);
      document.getElementById('reservationsGrid').innerHTML = `
        <div class="empty-state">
          <h3>Gabim në ngarkimin e të dhënave</h3>
          <p>${error.message}</p>
        </div>
      `;
    });

    // Render reservations based on filter
    function renderReservations(filter) {
      const grid = document.getElementById('reservationsGrid');
      
      let filtered = allReservations;
      if (filter !== 'all') {
        filtered = allReservations.filter(r => r.status === filter);
      }

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <h3>Nuk ka rezervime</h3>
            <p>Nuk ka rezervime ${filter === 'all' ? '' : 'me këtë status'} aktualisht.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(reservation => `
        <div class="reservation-card ${reservation.status}">
          <div class="card-header">
            <div>
              <div class="reservation-time">📅 ${reservation.date}</div>
              <div class="reservation-time">⏰ ${reservation.time}</div>
            </div>
            <span class="status-badge ${reservation.status}">
              ${reservation.status === 'pending' ? 'Në Pritje' : 
                reservation.status === 'completed' ? 'Përfunduar' : 'Anuluar'}
            </span>
          </div>

          <div class="reservation-info">
            <div class="info-row">
              <span class="info-label">👤 Klienti:</span>
              <span class="info-value">${reservation.clientName}</span>
            </div>
            <div class="info-row">
              <span class="info-label">📞 Telefoni:</span>
              <span class="info-value">${reservation.clientPhone}</span>
            </div>
            <div class="info-row">
              <span class="info-label">💈 Shërbimi:</span>
              <span class="info-value">${reservation.service}</span>
            </div>
            <div class="info-row">
              <span class="info-label">👨‍💼 Stilisti:</span>
              <span class="info-value">${reservation.staffName}</span>
            </div>
            ${reservation.message ? `
              <div class="info-row">
                <span class="info-label">📝 Mesazh:</span>
                <span class="info-value">${reservation.message}</span>
              </div>
            ` : ''}
          </div>

          ${reservation.status === 'pending' ? `
            <div class="card-actions">
              <button class="action-btn complete-btn" onclick="updateStatus('${reservation.id}', 'completed')">
                ✓ Përfundo
              </button>
              <button class="action-btn cancel-btn" onclick="updateStatus('${reservation.id}', 'cancelled')">
                ✕ Anulo
              </button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    // Update reservation status
    window.updateStatus = async function(reservationId, newStatus) {
      try {
        console.log(`[Dashboard] Updating reservation ${reservationId} to ${newStatus}`);
        const reservationRef = doc(db, "reservations", reservationId);
        await updateDoc(reservationRef, {
          status: newStatus,
          updatedAt: new Date().toISOString()
        });
        console.log(`[Dashboard] Status updated successfully`);
      } catch (error) {
        console.error("[Dashboard] Error updating status:", error);
        alert("Gabim në përditësimin e statusit: " + error.message);
      }
    };

    // Filter buttons
    const filterButtons = document.querySelectorAll('.filter-btn');
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderReservations(currentFilter);
      });
    });
  </script>
</body>
</html>
